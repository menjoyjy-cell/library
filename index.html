<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PH-NRRU Library</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#06C755;--pink:#FF2D87;--lime:#C8FF1A;--ink:#1D1B3A;--bg:#FFF4F9;--muted:#6B6785}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Prompt,sans-serif;background-color:var(--bg);background-image:radial-gradient(#FFD3E6 2px,transparent 2.5px);background-size:22px 22px}
.wrap{max-width:620px;margin:auto;padding:20px 16px 40px}
.hero{position:relative;overflow:hidden;background:var(--green);color:#fff;padding:26px 22px 28px;border-radius:30px;border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink)}
.hero:before{content:"";position:absolute;right:-50px;top:-60px;width:210px;height:210px;border-radius:50%;background:var(--pink)}
.hero>*{position:relative;z-index:1}
.hero h1{margin:0;font-size:28px;font-weight:800;text-shadow:2px 2px 0 var(--ink)}
.hero p{margin:14px 0 0;max-width:85%;font-weight:500;font-size:14px}
.card{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:18px;margin:18px 0;box-shadow:0 5px 0 var(--ink)}
#status{background:var(--lime);font-weight:600;font-size:15px}
#status.error{background:var(--pink);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.meta{font-size:13px;color:var(--muted);margin:10px 0;font-weight:500}
button{background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px 18px;font:700 15px Prompt,sans-serif;cursor:pointer;box-shadow:0 5px 0 var(--ink);width:100%}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button:disabled{opacity:.5;cursor:not-allowed}
input{padding:13px 14px;border:3px solid var(--ink);border-radius:16px;font:500 16px Prompt,sans-serif;width:100%;margin:8px 0 14px}
label{font-weight:600}
.muted{color:var(--muted);font-size:13px}
.btn-green{background:var(--green);color:var(--ink)}
.btn-light{background:#fff;color:var(--ink)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn-row button{padding:10px 12px;font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 0}
.tabs button{padding:10px;font-size:14px;background:#fff;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
.badge{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.b-wait{background:#FFF2BD}.b-ok{background:#DCFFE9}.b-no{background:#FFE0E9}
.uid{font-family:monospace;font-size:13px;word-break:break-all;background:#f5f0f5;border-radius:10px;padding:10px;margin:10px 0}
</style>
</head>
<body>
<main class="wrap">
  <div class="hero"><h1>📚 PH-NRRU Library</h1><p>ตรวจสอบรายการยืมและต่ออายุเล่มวิจัยผ่าน LINE</p></div>
  <div id="status" class="card">กำลังเริ่มต้นระบบ...</div>
  <div id="content"></div>
</main>

<script>
/* ===== ตั้งค่า 2 บรรทัดนี้ ===== */
const LIFF_ID = '2012225621-LKNYtBNF';
const API_URL = 'https://script.google.com/macros/s/AKfycbym_tfW317eDx6zDRxALK1qtwBDS5vMQlrxiY1hNbje4Rrh2CZRsEBsXuEQxIvrwyzfUg/exec';

let token = '';
const statusEl = document.getElementById('status');
const content  = document.getElementById('content');

function msg(t, err=false){ statusEl.textContent = t; statusEl.className = 'card' + (err ? ' error' : ''); }
function safe(t){ return String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ใช้ text/plain เพื่อไม่ให้เกิด CORS preflight กับ Apps Script
async function api(action, payload = {}){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({action, idToken: token, ...payload})
  });
  let j;
  try { j = await res.json(); }
  catch (_) { throw new Error('เชื่อมต่อ Apps Script ไม่ได้ — ตรวจว่า Deploy เป็นเว็บแอป และสิทธิ์เข้าถึงเป็น "ทุกคน"'); }
  if (!j.ok) {
    if (String(j.error).startsWith('TOKEN_INVALID')) {
      if (relogin()) throw new Error('กำลังเข้าสู่ระบบใหม่...');
      throw new Error('ยืนยันตัวตนไม่ผ่าน: ' + String(j.error).replace('TOKEN_INVALID: ','') + ' (ตรวจค่า LINE_CHANNEL_ID ใน Apps Script)');
    }
    throw new Error(j.error);
  }
  return j.data;
}

/* กันวนลูปล็อกอิน: ลองใหม่ได้ไม่เกิน 2 ครั้งต่อการเปิดหน้า */
const LOGIN_KEY = 'phnrru_login_try';
function loginTries(){ try { return Number(sessionStorage.getItem(LOGIN_KEY) || 0); } catch (_) { return 0; } }
function setLoginTries(n){ try { sessionStorage.setItem(LOGIN_KEY, String(n)); } catch (_) {} }

function relogin(){
  const n = loginTries();
  if (n >= 2) return false;
  setLoginTries(n + 1);
  if (liff.isLoggedIn()) liff.logout();
  liff.login();
  return true;
}

/* โหมดหน้า: นักศึกษา (ค่าเริ่มต้น) หรือ แอดมิน (?mode=admin) */
const MODE_KEY = 'phnrru_mode';
function readModeFromUrl(afterInit){
  const p = new URLSearchParams(location.search);
  let m = p.get('mode');
  if (!m && p.get('liff.state')) m = new URLSearchParams(p.get('liff.state').replace(/^[^?]*\?/, '')).get('mode');
  if (m) { setMode(m); return; }
  // เปิดจากลิงก์ปกติ (ไม่มี mode) และไม่ได้กลับมาจากการล็อกอิน → โหมดนักศึกษา
  if (afterInit && loginTries() === 0) setMode('student');
}
function getMode(){ try { return sessionStorage.getItem(MODE_KEY) || 'student'; } catch (_) { return 'student'; } }
function setMode(m){ try { sessionStorage.setItem(MODE_KEY, m); } catch (_) {} }

async function start(){
  try {
    readModeFromUrl();
    msg('กำลังเชื่อมต่อ LINE...');
    await liff.init({liffId: LIFF_ID, withLoginOnExternalBrowser: true});
    readModeFromUrl(true);
    if (!liff.isLoggedIn()) {
      if (relogin()) return;
      throw new Error('เข้าสู่ระบบ LINE ไม่สำเร็จ กรุณาปิดแล้วเปิดใหม่ผ่านแอป LINE');
    }

    // ID token หมดอายุ (~1 ชม.) ต้อง login ใหม่ ไม่งั้น verify ฝั่ง server ไม่ผ่าน
    const decoded = liff.getDecodedIDToken();
    if (!decoded || decoded.exp * 1000 < Date.now() + 60000) {
      if (relogin()) return;
      throw new Error('ไม่ได้รับ ID Token — ตรวจว่า LIFF เปิด scope "openid" แล้ว');
    }

    token = liff.getIDToken();
    if (!token) throw new Error('ไม่ได้รับ ID Token — ตรวจว่า LIFF เปิด scope "openid" แล้ว');
    if (getMode() === 'admin') await refreshAdmin(); else await refresh();
    setLoginTries(0);
  } catch (e) {
    const code = e && e.code ? ` [${e.code}]` : '';
    msg((e.message || String(e)) + code, true);
  }
}

async function refresh(){
  try {
    msg('กำลังตรวจสอบข้อมูล...');
    const data = await api('myLoans');
    const adminCard = data.isAdmin
      ? `<div class="card"><div class="row"><strong>🛡️ คุณเป็นแอดมิน</strong></div>
           <button class="btn-green" style="margin-top:12px" onclick="goAdmin()">ไปหน้าอนุมัติบัญชี LINE</button></div>`
      : '';
    let html = '';

    if (data.status === 'ยังไม่เชื่อมบัญชี') {
      msg('เชื่อมบัญชีครั้งแรกเพื่อดูรายการยืม');
      html = `<div class="card"><label>รหัสนักศึกษา</label>
        <input id="sid" placeholder="กรอกรหัสนักศึกษา" inputmode="numeric">
        <button id="bindBtn" onclick="bind()">ส่งคำขอเชื่อมบัญชี</button>
        <p class="muted">เจ้าหน้าที่จะตรวจสอบและอนุมัติการเชื่อมบัญชีครั้งแรก</p></div>`;
    } else if (data.status !== 'อนุมัติ') {
      msg('สถานะ: ' + data.status + ' — กรุณารอเจ้าหน้าที่อนุมัติ');
      html = '<div class="card"><button onclick="refresh()">ตรวจสอบอีกครั้ง</button></div>';
    } else {
      msg('สวัสดี ' + (data.name || '') + ' • บัญชีได้รับอนุมัติแล้ว');
      html = !data.loans.length
        ? '<div class="card">ไม่มีรายการยืมค้างอยู่</div>'
        : data.loans.map(l => `
          <div class="card">
            <div class="row"><strong>${safe(l.bookId)}</strong><span>${l.overdue ? '🔴 เกินกำหนด' : '🟢 กำลังยืม'}</span></div>
            <div style="margin:10px 0">${safe(l.title)}</div>
            <div class="meta">กำหนดคืน: ${safe(l.dueDate)} · ต่ออายุแล้ว ${Number(l.renewCount) || 0} ครั้ง</div>
            <button data-id="${safe(l.transactionId)}" onclick="renew(this)">ต่ออายุ +7 วัน</button>
          </div>`).join('');
    }
    content.innerHTML = html + adminCard;
  } catch (e) { msg(e.message || String(e), true); }
}

/* =================== โหมดแอดมิน =================== */
let adminFilter = 'รออนุมัติ';

function goAdmin(){ setMode('admin'); refreshAdmin(); window.scrollTo(0,0); }
function goStudent(){ setMode('student'); refresh(); window.scrollTo(0,0); }

async function refreshAdmin(){
  try {
    msg('กำลังโหลดคำขอเชื่อมบัญชี...');
    const data = await api('adminList');
    renderAdmin(data);
  } catch (e) {
    const m = String(e.message || e);
    if (m.startsWith('NOT_ADMIN:')) {
      const uid = m.slice('NOT_ADMIN:'.length);
      msg('บัญชี LINE นี้ยังไม่ได้เป็นแอดมิน', true);
      content.innerHTML = `<div class="card">
        <strong>LINE User ID ของคุณ</strong>
        <div class="uid" id="myUid">${safe(uid)}</div>
        <button class="btn-green" onclick="copyUid()">คัดลอก User ID</button>
        <p class="muted">ส่ง User ID นี้ให้ผู้ดูแลระบบ เพื่อเพิ่มใน <b>ADMIN_LINE_IDS</b> ของ Apps Script</p>
        <button class="btn-light" style="margin-top:8px" onclick="goStudent()">กลับหน้านักศึกษา</button>
      </div>`;
      return;
    }
    msg(m, true);
  }
}

function renderAdmin(data){
  const items = data.items || [];
  const shown = adminFilter === 'all' ? items : items.filter(x => x.status === adminFilter);
  msg(`🛡️ โหมดแอดมิน • รออนุมัติ ${data.pending || 0} รายการ`);
  const badge = s => s === 'อนุมัติ' ? '<span class="badge b-ok">อนุมัติแล้ว</span>'
    : s === 'ปฏิเสธ' ? '<span class="badge b-no">ปฏิเสธ/ยกเลิก</span>'
    : '<span class="badge b-wait">รออนุมัติ</span>';
  const actions = x => {
    const id = safe(x.userId);
    if (x.status === 'อนุมัติ') return `<div class="btn-row" style="grid-template-columns:1fr"><button data-uid="${id}" data-st="ปฏิเสธ" onclick="setBinding(this)">ยกเลิกการเชื่อม</button></div>`;
    if (x.status === 'ปฏิเสธ') return `<div class="btn-row" style="grid-template-columns:1fr"><button class="btn-green" data-uid="${id}" data-st="อนุมัติ" onclick="setBinding(this)">อนุมัติ</button></div>`;
    return `<div class="btn-row">
      <button class="btn-green" data-uid="${id}" data-st="อนุมัติ" onclick="setBinding(this)">✓ อนุมัติ</button>
      <button data-uid="${id}" data-st="ปฏิเสธ" onclick="setBinding(this)">✕ ปฏิเสธ</button></div>`;
  };
  content.innerHTML = `
    <div class="tabs">
      <button class="${adminFilter === 'รออนุมัติ' ? 'on' : ''}" onclick="setAdminFilter('รออนุมัติ')">รออนุมัติ (${data.pending || 0})</button>
      <button class="${adminFilter === 'all' ? 'on' : ''}" onclick="setAdminFilter('all')">ทั้งหมด (${items.length})</button>
    </div>
    ${shown.length ? shown.map(x => `
      <div class="card">
        <div class="row"><strong>${safe(x.studentId)}</strong>${badge(x.status)}</div>
        <div style="margin:8px 0;font-weight:600">${safe(x.name)}</div>
        <div class="meta">ขอเมื่อ ${safe(x.requestedAt || '-')}${x.approvedAt ? ' · อนุมัติ ' + safe(x.approvedAt) : ''}</div>
        ${actions(x)}
      </div>`).join('')
      : `<div class="card" style="text-align:center">${adminFilter === 'รออนุมัติ' ? 'ไม่มีคำขอที่รออนุมัติ 🎉' : 'ยังไม่มีรายการ'}</div>`}
    <div class="card"><div class="btn-row">
      <button class="btn-light" onclick="refreshAdmin()">↻ รีเฟรช</button>
      <button class="btn-light" onclick="goStudent()">หน้านักศึกษา</button>
    </div></div>`;
  window.lastAdminData = data;
}

function setAdminFilter(f){ adminFilter = f; if (window.lastAdminData) renderAdmin(window.lastAdminData); }

async function setBinding(btn){
  const status = btn.dataset.st;
  const q = status === 'อนุมัติ' ? 'อนุมัติให้นักศึกษาคนนี้ใช้งานผ่าน LINE?' : 'ปฏิเสธ/ยกเลิกการเชื่อมบัญชีนี้?';
  if (!confirm(q)) return;
  btn.disabled = true;
  try {
    const data = await api('adminSet', {userId: btn.dataset.uid, status});
    renderAdmin(data);
    alert(data.message);
  } catch (e) { msg(e.message || String(e), true); btn.disabled = false; }
}

function copyUid(){
  const t = document.getElementById('myUid').textContent;
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
    .then(() => alert('คัดลอกแล้ว'))
    .catch(() => prompt('คัดลอก User ID นี้', t));
}

async function bind(){
  const sid = document.getElementById('sid').value.trim();
  if (!sid) return msg('กรุณากรอกรหัสนักศึกษา', true);
  const btn = document.getElementById('bindBtn'); btn.disabled = true;
  try { msg('กำลังส่งคำขอ...'); await api('bind', {studentId: sid}); await refresh(); }
  catch (e) { msg(e.message || String(e), true); btn.disabled = false; }
}

async function renew(btn){
  if (!confirm('ยืนยันต่ออายุเล่มนี้อีก 7 วัน? หากเกินกำหนดจะนับจากวันนี้')) return;
  btn.disabled = true; btn.textContent = 'กำลังต่ออายุ...';
  try {
    const result = await api('renew', {transactionId: btn.dataset.id});
    alert(result.message);
    await refresh();
  } catch (e) { msg(e.message || String(e), true); btn.disabled = false; btn.textContent = 'ต่ออายุ +7 วัน'; }
}

start();
</script>
</body>
</html>
